name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: flake8 schlda examples tests
      - run: pytest -q
        env:
          NUMBA_NUM_THREADS: "2"
      - run: python examples/vignette.py vignette_out
        env:
          MPLBACKEND: Agg
