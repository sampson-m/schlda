[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schlda"
version = "0.3.0"
description = "Hierarchical LDA for annotated single-cell count data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Sampson" }]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "numba>=0.56",
    "anndata>=0.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest", "flake8", "build"]

[project.urls]
Homepage = "https://github.com/sampson-m/schlda"

[tool.setuptools]
packages = ["schlda"]
